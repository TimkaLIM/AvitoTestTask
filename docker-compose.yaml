services:
  db:
    image: postgres:16-alpine
    container_name: avitotask_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: train66
    ports:
      - "5447:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://admin:1234@db:5432/train66?sslmode=disable"
    depends_on:
      - db

  restaurant:
    build:
      context: .
      dockerfile: Dockerfile.restaurant
    environment:
      API_URL: "http://api:8080"
      RESTAURANT_ID: "1"
    depends_on:
      - api
volumes:
  postgres_data:
