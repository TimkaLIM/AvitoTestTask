paths:
  /restaurants:
    get:
      summary: Получить список всех ресторанов
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
  /restaurants/{id}/menu:
    get:
      summary: Получить меню ресторана
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID ресторана
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    restaurant_id:
                      type: integer
                      description: id ресторана, меню которого мы смотрим
                    name:
                      type: string
                    price:
                      type: integer
  /orders:
    post:
      summary: Создать новый заказ
      requestBody:
        required: true #это значит, что без этого тела запрос не пройдет (400)
        content:
          application/json:
            schema:
              type: object
              properties:
                restaurant_id:
                  type: integer
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      menu_item_id:
                        type: integer
                      quantity:
                        type: integer
      responses:
        '201':
          description: Заказ успешно создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id:
                    type: integer
                  status:
                    type: string
  /orders/{id}:
    get:
      summary: Клиент смотрит на статус своего заказа
      parameters:
        - in: path
          name: id
          description: id заказа
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    type: string
                    description: статус заказа (new,cooking,delivering,done)
                  total_price:
                    type: integer
        '404':
          description: Заказ не найден
  /orders/{id}/status:
    patch:
      summary: Ресторан меняет статус заказа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  description: Новый статус заказа
                  type: string
      parameters:
        - in: path
          name: id
          description: id заказа
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Статус заказа изменён
        '404':
          description: Заказ не найден
  /restaurant/orders:
    get:
      summary: Возвращает массив всех заказов ресторана
      parameters:
        - in: query
          name: restaurant_id
          required: true
          schema:
            type: integer
          description: ID ресторана
        - in: query
          name: status
          required: false #ресторан может запросить все заказы, или только новые
          schema:
            type: string
          description: статус заказа
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    status:
                      type: string
                    total_price:
                      type: integer
